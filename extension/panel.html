<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Geo Panel</title><link rel="stylesheet" href="panel.css"></head>
<body>
  <header><span class="logo">◎</span><div><h1>Geo Panel</h1><p>地理位置侧栏 · 本地运行</p></div><span class="badge">0.1</span></header>
  <main>
    <section class="hero"><span class="eyebrow">CURRENT LOCATION</span><h2>每一个坐标，<br>都通向一个地方。</h2><p>读取当前加载的街景位置，或粘贴坐标查看地图。</p><button id="read" class="primary">◎ 读取当前位置</button></section>
    <section class="card" aria-label="坐标"><div class="row"><h3>位置</h3><span id="source">等待读取</span></div><p id="coordinates" class="coordinates">—, —</p><p id="freshness" class="muted">坐标只保留在当前游戏页面，刷新即清除。</p><div class="actions"><button id="copy" disabled>复制坐标</button><a id="maps" class="button disabled" target="_blank" rel="noopener noreferrer" aria-disabled="true">在地图查看 ↗</a></div><button id="place" class="wide" disabled>在游戏地图落点</button></section>
    <section class="card"><h3>地图设置</h3><label class="row setting" for="auto"><span>读取时自动落点<small>只放标记，不提交答案</small></span><input id="auto" type="checkbox" role="switch"></label><label class="row setting" for="zoom"><span>缩放动画<small>落点前逐级放大</small></span><input id="zoom" type="checkbox" role="switch"></label><label for="radius" class="row setting"><span>随机偏移半径<small>距离范围，不保证对应游戏分数</small></span><output id="radiusValue">0 m</output></label><input id="radius" type="range" min="0" max="10000" step="100" value="0" aria-label="随机偏移半径（米）"></section>
    <details class="card"><summary>手动查看坐标</summary><label for="manual">纬度, 经度</label><input id="manual" type="text" placeholder="25.033000, 121.565400" autocomplete="off"><button id="manualShow" class="wide">显示坐标与地图链接</button><p class="muted">手动坐标只用于查看，不发送到游戏地图。</p></details>
    <p id="status" role="status" aria-live="polite">打开 GeoGuessr 或 OpenGuessr，安装后请刷新游戏页面。</p>
    <footer>无账号 · 无 API Key · 无订阅<br>当前街景可能不同于回合起点；实站适配仍待验证。</footer>
  </main><script src="core.js"></script><script src="panel.js"></script>
</body></html>
